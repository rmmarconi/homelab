# Métricas do OpenClaw para o Prometheus da VM monitor (10.1.1.15).
# O gateway só escuta em 127.0.0.1:18789 e exige o token de operador; o nginx
# injeta esse token (arquivo root 600, fora do git) e expõe SÓ a rota de
# métricas, SÓ para o monitor. Assim o token nunca sai desta VM.
# Recriar o arquivo do token: sudo openclaw-metrics-token-sync
server {
    listen 18790;
    listen [::]:18790;
    server_name _;

    location = /api/diagnostics/prometheus {
        allow 127.0.0.1;
        allow ::1;
        allow 10.1.1.15;
        deny all;

        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        include /etc/nginx/openclaw-metrics-auth.conf;
    }

    location / {
        return 404;
    }
}
