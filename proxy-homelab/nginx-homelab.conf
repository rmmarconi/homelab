# *.homelab.rafaelmarconi.com.br: nomes para os serviços que antes eram acessados por IP.
# DNS: rewrite *.homelab.rafaelmarconi.com.br -> 10.1.1.100 no AdGuard (só existe na LAN).
# Certificado wildcard via certbot dns-cloudflare (cert-name homelab.rafaelmarconi.com.br).
# Para um serviço novo: copie um server block, ajuste server_name e proxy_pass.

map $http_upgrade $hl_connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name homelab.rafaelmarconi.com.br *.homelab.rafaelmarconi.com.br;
    allow 10.1.0.0/16; allow 127.0.0.1; deny all;
    return 301 https://$host$request_uri;
}

# homelab.rafaelmarconi.com.br = o painel de serviços
server {
    listen 443 ssl http2;
    server_name homelab.rafaelmarconi.com.br;
    include snippets/homelab-tls.conf;
    root /var/www/painel;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
    location = /status.json { alias /var/www/painel/status/status.json; add_header Cache-Control "no-store" always; }
    location = /services.json { add_header Cache-Control "no-cache" always; }
    location /icons/ { expires 7d; }
    location / { try_files $uri $uri/ =404; }
    access_log /var/log/nginx/homelab.access.log;
}

# Proxmox VE (pve)
server {
    listen 443 ssl http2;
    server_name proxmox.homelab.rafaelmarconi.com.br;
    include snippets/homelab-tls.conf;
    location / {
        proxy_pass https://10.1.1.254:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $hl_connection_upgrade;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 0;
    }
    access_log /var/log/nginx/homelab.access.log;
}

