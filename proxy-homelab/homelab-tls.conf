# TLS + restrição à LAN, comum a todos os server blocks de *.homelab.rafaelmarconi.com.br
ssl_certificate     /etc/letsencrypt/live/homelab.rafaelmarconi.com.br/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/homelab.rafaelmarconi.com.br/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
allow 10.1.0.0/16;
allow 127.0.0.1;
deny  all;
