# Broker MQTT do homelab. Sem usuário/senha: o acesso é limitado pelo ufw
# (só a própria VM e o Home Assistant em 10.1.1.11 alcançam a porta 1883).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0
allow_anonymous true
