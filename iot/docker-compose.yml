# VM iot (10.1.1.12 na VLAN 100, 10.1.2.12 na VLAN IoT)
# Rede do host em todos os serviços: assim o ufw vale para as portas
# (portas publicadas pelo Docker passariam por cima do firewall).
name: iot

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.0
    container_name: frigate
    restart: unless-stopped
    network_mode: host
    shm_size: 512mb
    mem_limit: 2500m
    stop_grace_period: 30s
    environment:
      TZ: America/Bahia
    volumes:
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    depends_on: [mosquitto]

volumes:
  mosquitto-data:
