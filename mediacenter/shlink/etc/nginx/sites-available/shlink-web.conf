# Painel web do Shlink (app estático; a chave de API fica só no navegador de quem usa)
server {
    listen 443 ssl http2;
    server_name shlink.media.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/shlink-web-client;
    index index.html;
    location = /servers.json { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }

    access_log /var/log/nginx/shlink-web.access.log;
    error_log  /var/log/nginx/shlink-web.error.log;
}
