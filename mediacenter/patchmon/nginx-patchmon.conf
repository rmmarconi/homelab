# PatchMon (Docker em /opt/patchmon, porta 127.0.0.1:3000). Só a LAN: o servidor tem terminal SSH
# e aplica atualizações nos hosts, então não fica exposto na internet.
server {
    listen 443 ssl http2;
    server_name patchmon.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/patchmon.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patchmon.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    allow 10.1.0.0/16;
    allow 127.0.0.1;
    deny  all;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/patchmon.access.log;
    error_log  /var/log/nginx/patchmon.error.log;
}
