# Painel do homelab (página estática em /var/www/painel). Só a LAN: lista IPs e serviços internos.
server {
    listen 443 ssl http2;
    server_name painel.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/painel.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    allow 10.1.0.0/16;
    allow 127.0.0.1;
    deny  all;

    root /var/www/painel;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location = /status.json { alias /var/www/painel/status/status.json; add_header Cache-Control "no-store" always; }
    location = /services.json { add_header Cache-Control "no-cache" always; }
    location /icons/ { expires 7d; }
    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/painel.access.log;
    error_log  /var/log/nginx/painel.error.log;
}
