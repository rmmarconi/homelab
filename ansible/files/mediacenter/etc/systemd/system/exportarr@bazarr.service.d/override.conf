# O Bazarr guarda a API key em config.yaml (não em config.xml).
# Extrai a chave de auth.apikey para um arquivo em /run a cada start,
# legível só pelo usuário do serviço; a chave nunca fica em unit ou env.
[Service]
RuntimeDirectory=exportarr-bazarr
RuntimeDirectoryMode=0700
ExecStartPre=+/bin/sh -c "awk \x27/^auth:/{f=1;next} /^[^ ]/{f=0} f && /apikey:/{print $2}\x27 /var/lib/mediacenter/bazarr/config/config.yaml | tr -d \x22\x27\x22 > /run/exportarr-bazarr/key && chown mediacenter: /run/exportarr-bazarr/key && chmod 0400 /run/exportarr-bazarr/key"
ExecStart=
ExecStart=/usr/local/bin/exportarr bazarr --url http://127.0.0.1:${APP_PORT} --api-key-file /run/exportarr-bazarr/key --interface 0.0.0.0 --port ${EXPORTER_PORT}
