# Roda o Seerr com o mesmo usuário de serviço do resto da stack (antes: root)
[Service]
User=mediacenter
Group=mediacenter
UMask=0002
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=full
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
ReadWritePaths=/opt/mediacenter/seerr
