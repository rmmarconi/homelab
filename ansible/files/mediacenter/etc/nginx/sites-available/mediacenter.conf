# ─────────────────────────────────────────────────────────────────────────────
#  /etc/nginx/conf.d/mediacenter.conf
#
#  Proxy reverso para o media center.
#  Proxy: 10.1.1.10   ·   Aplicações: 10.1.1.100   ·   media.rafaelmarconi.com.br
#
#  Antes de recarregar o nginx, o certificado precisa existir:
#
#    sudo apt install nginx certbot python3-certbot-dns-cloudflare
#    printf 'dns_cloudflare_api_token = SEU_TOKEN\n' | sudo tee /etc/letsencrypt/dns-credentials.ini
#    sudo chmod 600 /etc/letsencrypt/dns-credentials.ini
#    sudo certbot certonly --dns-cloudflare \
#         --dns-cloudflare-credentials /etc/letsencrypt/dns-credentials.ini \
#         --cert-name media.rafaelmarconi.com.br \
#         -d media.rafaelmarconi.com.br -d '*.media.rafaelmarconi.com.br' \
#         --deploy-hook 'systemctl reload nginx' \
#         --email SEU@EMAIL --agree-tos --no-eff-email --staging
#
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Wildcard exige DNS-01 (o único desafio que emite wildcard), e assim nenhum
#  subdomínio precisa ser público para validar. Troque --dns-cloudflare pelo
#  plugin do seu provedor. O Registro.br não tem plugin: nesse caso delegue só
#  o desafio, com um CNAME de _acme-challenge.media.rafaelmarconi.com.br para
#  um provedor com API (ou para o acme-dns).
#
#  Rode com --staging primeiro. Depois repita sem --staging.
#  Renovação é automática pelo certbot.timer.
# ─────────────────────────────────────────────────────────────────────────────

# ── Endereços das aplicações: tudo que você precisa editar está aqui ────────
upstream jellyfin_up    { server 10.1.1.100:8096; }
upstream seerr_up       { server 10.1.1.100:5055; }
upstream qbittorrent_up { server 10.1.1.100:8080; }
upstream radarr_up      { server 10.1.1.100:7878; }
upstream sonarr_up      { server 10.1.1.100:8989; }
upstream lidarr_up      { server 10.1.1.100:8686; }
upstream prowlarr_up    { server 10.1.1.100:9696; }
upstream bazarr_up      { server 10.1.1.100:6767; }

# WebSocket: os *arr usam SignalR e o Seerr manda atualizações ao vivo. Sem
# isso a UI carrega e nunca se atualiza sozinha. O map deixa o header
# Connection condicional — mandar "upgrade" sempre quebraria o keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP: redireciona tudo para HTTPS ───────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Mantido para o caso de você trocar DNS-01 por HTTP-01 algum dia.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS catch-all: derruba Host desconhecido ──────────────────────────────
# Sem um default_server aqui, o nginx responderia a qualquer hostname com o
# primeiro bloco que casar — expondo um serviço num nome que não era o dele.
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;

    return 444;
}

# ── TLS e cabeçalhos, iguais em todos os blocos ─────────────────────────────
# Repetidos porque o nginx não tem "import" como o Caddy. Se preferir, mova
# para /etc/nginx/snippets/ e troque por um include.

# ── Raiz: manda para o portal de pedidos ────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name media.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Para hospedar arquivos aqui em vez de redirecionar, troque o return por:
    #   root  /var/www/media;
    #   index index.html;
    return 302 https://requests.media.rafaelmarconi.com.br;
}

# ── Jellyfin ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name jellyfin.media.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Streaming: nada de bufferizar, e conexão longa não pode ser cortada.
    # É o equivalente ao flush_interval -1 do Caddy.
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    100M;

    location / {
        proxy_pass http://jellyfin_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    access_log /var/log/nginx/jellyfin.access.log;
    error_log  /var/log/nginx/jellyfin.error.log;
}

# ── Seerr (pedidos) ─────────────────────────────────────────────────────────
# jellyseerr fica como alias para bookmarks antigos sobreviverem ao rename.
server {
    listen 443 ssl http2;
    server_name requests.media.rafaelmarconi.com.br
                seerr.media.rafaelmarconi.com.br
                jellyseerr.media.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://seerr_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    access_log /var/log/nginx/seerr.access.log;
    error_log  /var/log/nginx/seerr.error.log;
}

# ── qBittorrent ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name qbittorrent.media.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;   # upload de .torrent em lote

    location / {
        proxy_pass http://qbittorrent_up;
        proxy_http_version 1.1;

        # Mandando o endereço do PRÓPRIO backend como Host, a validação de
        # header Host e a checagem de CSRF do qBittorrent ficam satisfeitas —
        # então você pode DEIXAR "Enable Host header validation" LIGADO.
        # (Não use $proxy_host aqui: com upstream nomeado ele vale
        # "qbittorrent_up", não o IP:porta.)
        proxy_set_header Host              10.1.1.100:8080;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    access_log /var/log/nginx/qbittorrent.access.log;
    error_log  /var/log/nginx/qbittorrent.error.log;
}

# ── UIs administrativas ─────────────────────────────────────────────────────
#  Estas ficam acessíveis pela internet, protegidas só pelo login de cada
#  aplicação. Para limitar à rede local, descomente as 5 linhas de allow/deny
#  dentro do bloco que você quiser fechar.
#
#  Todas são estruturalmente idênticas: muda só o nome e o upstream.

# radarr — filmes
server {
    listen 443 ssl http2;
    server_name radarr.media.rafaelmarconi.com.br;

    ssl_certificate     /etc/letsencrypt/live/media.rafaelmarconi.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.rafaelmarconi.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Fechar para a LAN:
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # allow 127.0.0.0/8;
    # deny  all;

    location / {
        proxy_pass http://radarr_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    access_log /var/log/nginx/radarr.access.log;
    error_log  /var/log/nginx/radarr.error.log;
}

