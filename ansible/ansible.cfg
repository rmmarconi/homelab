[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
# segredos: group_vars/all/vault.yml criptografado com ansible-vault (nunca em texto puro no git)
vault_password_file = ~/.config/homelab/ansible-vault-pass

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=no
