- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  become: true

- name: Reload php-fpm
  ansible.builtin.service:
    name: php8.4-fpm
    state: reloaded
  become: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
