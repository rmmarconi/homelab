# UniFi UNAS 2 (10.1.1.253), compartilhamento SMB proxmox_backup, storage unas-backup:
#   <storage>/dump/            vzdump de VMs e LXCs (Proxmox gerencia e aplica a retenção)
#   <storage>/host-config/     configuração do próprio Proxmox (tar.zst diário, 30 dias)
#   <storage>/apps/<host>/     backups de aplicação (mediacenter empurra direto; VMs ficam dentro do vzdump)
#   <storage>/git/             repositórios homelab e homelab-terraform (bare)

# O storage SMB é criado uma vez à mão (a senha é digitada pelo Rafael, nunca passa pelo Ansible):
#   read -rsp "Senha: " P; pvesm add cifs unas-backup --server 10.1.1.253 --share proxmox_backup \
#     --username proxmox --password "$P" --content backup,iso,vztmpl,snippets \
#     --prune-backups keep-daily=7,keep-weekly=4,keep-monthly=3 --options vers=3.1.1,hard,echo_interval=10
- name: Storage ativo e montado
  ansible.builtin.command: pvesm status --storage {{ nas_storage_id }}
  register: backup_nas_pvesm_status
  changed_when: false
  check_mode: false
  failed_when: "'active' not in backup_nas_pvesm_status.stdout"

- name: Pastas de backup no NAS (SMB não aceita chmod; permissões vêm da montagem)
  ansible.builtin.file:
    path: "{{ nas_mountpoint }}/{{ item }}"
    state: directory
  # noqa: risky-file-permissions
  loop: [host-config, apps, apps/mediacenter, git]

- name: Jobs de backup existentes
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: backup_nas_jobs
  changed_when: false
  check_mode: false

- name: Job diário de vzdump (todos os convidados ativos)
  ansible.builtin.command: >-
    pvesh create /cluster/backup --id homelab-diario --schedule "{{ backup_schedule }}"
    --storage {{ nas_storage_id }} --all 1 --exclude {{ backup_exclude_vmids | join(',') }}
    --mode snapshot --compress zstd --zstd 2 --enabled 1
    --prune-backups {{ backup_retention }} --notes-template "{{ '{{guestname}}' }}"
    --comment "Backup diário de VMs e LXCs no UNAS (Ansible)"
  when: "'homelab-diario' not in (backup_nas_jobs.stdout | from_json | map(attribute='id') | list)"
  changed_when: true

- name: Script de backup da configuração do Proxmox
  ansible.builtin.template:
    src: pve-config-backup.sh.j2
    dest: /usr/local/sbin/pve-config-backup
    mode: "0750"

- name: Units do backup de configuração
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: pve-config-backup.service
      content: |
        [Unit]
        Description=Backup da configuração do Proxmox no UNAS
        RequiresMountsFor={{ nas_mountpoint }}
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/pve-config-backup
    - name: pve-config-backup.timer
      content: |
        [Unit]
        Description=Backup diário da configuração do Proxmox
        [Timer]
        OnCalendar=*-*-* 02:00
        Persistent=true
        RandomizedDelaySec=5min
        [Install]
        WantedBy=timers.target

- name: Timer do backup de configuração
  ansible.builtin.systemd_service:
    name: pve-config-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"  # no check a unit ainda não existe

- name: Métricas de backup para o Prometheus (textfile)
  ansible.builtin.template:
    src: backup-metrics.sh.j2
    dest: /usr/local/sbin/backup-metrics
    mode: "0750"

- name: Coleta das métricas de backup a cada 15 min
  ansible.builtin.cron:
    name: backup-metrics
    minute: "*/15"
    job: /usr/local/sbin/backup-metrics
    user: root
