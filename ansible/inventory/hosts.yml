# Inventário do homelab. IPs e papéis espelham homelab-terraform/inventory/INVENTARIO.md.
all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 10.1.1.254
          ansible_user: root

    vms:
      hosts:
        monitor:
          ansible_host: 10.1.1.15
          ansible_user: rmmarconi
        openclaw:
          ansible_host: 10.1.1.20
          ansible_user: rmmarconi

    # LXCs sem SSH próprio: Ansible entra pelo Proxmox (pct exec) via proxmox_pct_remote.
    dns:
      vars:
        ansible_connection: community.general.proxmox_pct_remote
        ansible_host: 10.1.1.254
        ansible_user: root
      hosts:
        adguard-1:
          proxmox_vmid: 107
          adguard_role: primary
          adguard_ip: 10.1.1.3
        adguard-2:
          proxmox_vmid: 108
          adguard_role: replica
          adguard_ip: 10.1.1.4

    mediacenter_hosts:
      hosts:
        mediacenter:
          ansible_host: 10.1.1.100
          ansible_user: rmmarconi

    # Home Assistant OS não aceita Ansible direto: o role homeassistant roda no Proxmox
    # e fala com a VM 105 por qm guest exec / API.
