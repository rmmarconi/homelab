global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: unpoller
    static_configs:
      - targets: ["unpoller:9130"]
    metric_relabel_configs:
      # Nome da WAN por interface do UCG Fiber (Porta 2 = eth1, Porta 5 = eth4)
      - source_labels: [__name__, port]
        regex: "unpoller_device_wan_.+;eth1"
        target_label: wan
        replacement: "Go Internet"
      - source_labels: [__name__, port]
        regex: "unpoller_device_wan_.+;eth4"
        target_label: wan
        replacement: "Eletrodata"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: monitor}
      - targets: ["10.1.1.254:9100"]
        labels: {instance: pve}
      - targets: ["10.1.1.3:9100"]
        labels: {instance: adguard-1}
      - targets: ["10.1.1.4:9100"]
        labels: {instance: adguard-2}
      - targets: ["10.1.1.100:9100"]
        labels: {instance: mediacenter}
      # VM do OpenClaw: sistema + textfile openclaw.prom (agentes, rotinas, execuções, tokens)
      - targets: ["10.1.1.20:9100"]
        labels: {instance: openclaw}

  # Runtime do gateway OpenClaw (plugin diagnostics-prometheus). O nginx da VM
  # injeta o token do gateway e só aceita o monitor; nenhum segredo aqui.
  # Os contadores zeram quando o gateway reinicia: use increase()/rate().
  - job_name: openclaw
    metrics_path: /api/diagnostics/prometheus
    static_configs:
      - targets: ["10.1.1.20:18790"]
        labels: {instance: openclaw}

  - job_name: adguard
    static_configs:
      - targets: ["adguard-exporter:9618"]

  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["10.1.1.254"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: netflow
    static_configs:
      - targets: ["vector:9598"]

  # Mediacenter: Radarr/Sonarr/Lidarr/Prowlarr via Exportarr (binário nativo no host)
  - job_name: arr
    static_configs:
      - targets: ["10.1.1.100:9707"]
        labels: {app: radarr, instance: mediacenter}
      - targets: ["10.1.1.100:9708"]
        labels: {app: sonarr, instance: mediacenter}
      - targets: ["10.1.1.100:9709"]
        labels: {app: lidarr, instance: mediacenter}
      - targets: ["10.1.1.100:9710"]
        labels: {app: prowlarr, instance: mediacenter}
      - targets: ["10.1.1.100:9711"]
        labels: {app: bazarr, instance: mediacenter}

  - job_name: qbittorrent
    static_configs:
      - targets: ["qbittorrent-exporter:8090"]
        labels: {instance: mediacenter}

  - job_name: jellyfin
    static_configs:
      - targets: ["jellyfin-exporter:9594"]
        labels: {instance: mediacenter}

  # Disponibilidade das interfaces web (sonda HTTP a partir da VM monitor)
  # Métricas nativas do Jellyfin (.NET/servidor). Só respondem para a LAN (LocalNetworkSubnets).
  - job_name: jellyfin-native
    metrics_path: /metrics
    static_configs:
      - targets: ["10.1.1.100:8096"]
        labels: {instance: mediacenter}

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://10.1.1.100:8096/health
          - http://10.1.1.100:8080/api/v2/app/version
          - http://10.1.1.100:7878/ping
          - http://10.1.1.100:8989/ping
          - http://10.1.1.100:8686/ping
          - http://10.1.1.100:9696/ping
          - http://10.1.1.100:6767/
          - http://10.1.1.100:5055/api/v1/status
        labels: {instance: mediacenter}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - source_labels: [__param_target]
        regex: ".*:(8096|8080|7878|8989|8686|9696|6767|5055)/.*"
        target_label: app
        replacement: "$1"
      - source_labels: [app]
        regex: "8096"
        target_label: app
        replacement: jellyfin
      - source_labels: [app]
        regex: "8080"
        target_label: app
        replacement: qbittorrent
      - source_labels: [app]
        regex: "7878"
        target_label: app
        replacement: radarr
      - source_labels: [app]
        regex: "8989"
        target_label: app
        replacement: sonarr
      - source_labels: [app]
        regex: "8686"
        target_label: app
        replacement: lidarr
      - source_labels: [app]
        regex: "9696"
        target_label: app
        replacement: prowlarr
      - source_labels: [app]
        regex: "6767"
        target_label: app
        replacement: bazarr
      - source_labels: [app]
        regex: "5055"
        target_label: app
        replacement: seerr
      - target_label: __address__
        replacement: blackbox:9115

  # Home Assistant (integração prometheus:, token só de leitura em arquivo)
  - job_name: homeassistant
    scrape_interval: 60s
    metrics_path: /api/prometheus
    authorization:
      credentials_file: /etc/prometheus/secrets/ha_token
    static_configs:
      - targets: ["10.1.1.11:80"]
        labels: {instance: homeassistant}
