global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: unpoller
    static_configs:
      - targets: ["unpoller:9130"]
    metric_relabel_configs:
      # Nome da WAN por interface do UCG Fiber (Porta 2 = eth1, Porta 5 = eth4)
      - source_labels: [__name__, port]
        regex: "unpoller_device_wan_.+;eth1"
        target_label: wan
        replacement: "Go Internet"
      - source_labels: [__name__, port]
        regex: "unpoller_device_wan_.+;eth4"
        target_label: wan
        replacement: "Eletrodata"

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: monitor}
      - targets: ["10.1.1.254:9100"]
        labels: {instance: pve}
      - targets: ["10.1.1.3:9100"]
        labels: {instance: pihole-1}
      - targets: ["10.1.1.4:9100"]
        labels: {instance: pihole-2}

  - job_name: pihole
    static_configs:
      - targets: ["pihole-exporter:9617"]

  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["10.1.1.254"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: netflow
    static_configs:
      - targets: ["vector:9598"]
