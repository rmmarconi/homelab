name: monitoring

services:
  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    mem_limit: 128m
    restart: unless-stopped
    env_file: .env
    environment:
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_DISABLE: "false"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      UP_POLLER_DEBUG: "false"
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "true"
      UP_UNIFI_DEFAULT_SAVE_ALARMS: "true"
      UP_UNIFI_DEFAULT_SAVE_ANOMALIES: "true"
      UP_UNIFI_DEFAULT_SAVE_EVENTS: "true"
      UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
      UP_LOKI_URL: "http://loki:3100"
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    mem_limit: 1g
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:latest
    container_name: loki
    mem_limit: 768m
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]

  goflow2:
    image: netsampler/goflow2:latest
    container_name: goflow2
    mem_limit: 256m
    restart: unless-stopped
    command: ["-listen", "netflow://:2055,sflow://:6343", "-format", "json", "-transport", "file"]
    ports:
      - "2055:2055/udp"
      - "6343:6343/udp"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    mem_limit: 256m
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector:/etc/vector:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "514:1514/udp"
      - "514:1514/tcp"
    depends_on: [loki, goflow2]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    mem_limit: 64m
    restart: unless-stopped
    pid: host
    command: [--path.rootfs=/host]
    volumes: ["/:/host:ro,rslave"]

  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    container_name: adguard-exporter
    mem_limit: 64m
    restart: unless-stopped
    env_file: .env
    environment:
      ADGUARD_SERVERS: "http://10.1.1.3,http://10.1.1.4"
      INTERVAL: "30s"

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    mem_limit: 128m
    restart: unless-stopped
    env_file: .env
    environment:
      PVE_VERIFY_SSL: "false"

  qbittorrent-exporter:
    image: ghcr.io/martabal/qbittorrent-exporter:latest
    container_name: qbittorrent-exporter
    restart: unless-stopped
    mem_limit: 64m
    environment:
      QBITTORRENT_BASE_URL: "http://10.1.1.100:8080"
      # O IP da VM está na whitelist do qBittorrent ("Bypass authentication
      # for clients in whitelisted IP subnets"), então não há senha real aqui.
      QBITTORRENT_USERNAME: "monitor"
      QBITTORRENT_PASSWORD: "whitelist"
      EXPORTER_PORT: "8090"

  jellyfin-exporter:
    image: python:3.13-alpine
    container_name: jellyfin-exporter
    restart: unless-stopped
    mem_limit: 64m
    command: ["python3", "-u", "/app/exporter.py"]
    environment:
      JELLYFIN_URL: "http://10.1.1.100:8096"
      JELLYFIN_API_KEY: "${JELLYFIN_API_KEY:-}"
      PORT: "9594"
    volumes:
      - ./exporters/jellyfin/exporter.py:/app/exporter.py:ro

  solarman-exporter:
    image: python:3.13-alpine
    container_name: solarman-exporter
    restart: unless-stopped
    mem_limit: 64m
    command: ["python3", "-u", "/app/exporter.py"]
    # 3 microinversores Deye (4 placas cada) na casa dos pais, via VPN.
    # Protocolo Solarman V5 na porta 8899: só precisa do serial do logger (não é segredo).
    environment:
      SOLARMAN_TARGETS: "micro1=10.2.0.251:3926222475,micro2=10.2.0.190:3926982436,micro3=10.2.0.186:3926442305"
      SITE: "pais"
      PORT: "9595"
    volumes:
      - ./exporters/solarman/exporter.py:/app/exporter.py:ro

  nut-exporter:
    image: ghcr.io/druggeri/nut_exporter:3.2.1
    container_name: nut-exporter
    restart: unless-stopped
    mem_limit: 64m
    # Leitura anônima do upsd no pve (10.1.1.254:3493); sem usuário/senha.
    command: ["--nut.server=10.1.1.254", "--nut.vars_enable=battery.charge,battery.voltage,battery.voltage.nominal,input.voltage,input.voltage.nominal,output.voltage,output.frequency,ups.load,ups.status,ups.temperature,ups.beeper.status"]

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: blackbox
    restart: unless-stopped
    mem_limit: 64m
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox:/etc/blackbox:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    mem_limit: 768m
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel,grafana-worldmap-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
