name: monitoring

services:
  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    mem_limit: 128m
    restart: unless-stopped
    env_file: .env
    environment:
      UP_INFLUXDB_DISABLE: "true"
      UP_PROMETHEUS_DISABLE: "false"
      UP_PROMETHEUS_HTTP_LISTEN: "0.0.0.0:9130"
      UP_POLLER_DEBUG: "false"
      UP_UNIFI_DEFAULT_SAVE_SITES: "true"
      UP_UNIFI_DEFAULT_SAVE_DPI: "true"
      UP_UNIFI_DEFAULT_SAVE_ALARMS: "true"
      UP_UNIFI_DEFAULT_SAVE_ANOMALIES: "true"
      UP_UNIFI_DEFAULT_SAVE_EVENTS: "true"
      UP_UNIFI_DEFAULT_VERIFY_SSL: "false"
      UP_LOKI_URL: "http://loki:3100"
    depends_on: [loki]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    mem_limit: 1g
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:latest
    container_name: loki
    mem_limit: 768m
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]

  goflow2:
    image: netsampler/goflow2:latest
    container_name: goflow2
    mem_limit: 256m
    restart: unless-stopped
    command: ["-listen", "netflow://:2055,sflow://:6343", "-format", "json", "-transport", "file"]
    ports:
      - "2055:2055/udp"
      - "6343:6343/udp"
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    mem_limit: 256m
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector:/etc/vector:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "514:1514/udp"
      - "514:1514/tcp"
    depends_on: [loki, goflow2]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    mem_limit: 64m
    restart: unless-stopped
    pid: host
    command: [--path.rootfs=/host]
    volumes: ["/:/host:ro,rslave"]

  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    container_name: pihole-exporter
    mem_limit: 64m
    restart: unless-stopped
    env_file: .env
    environment:
      PIHOLE_HOSTNAME: "10.1.1.3,10.1.1.4"
      PIHOLE_PROTOCOL: "http"
      PIHOLE_PORT: "80"
      PORT: "9617"

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    mem_limit: 128m
    restart: unless-stopped
    env_file: .env
    environment:
      PVE_VERIFY_SSL: "false"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    mem_limit: 768m
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel,grafana-worldmap-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki]

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
