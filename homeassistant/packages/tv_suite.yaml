# TV da Suíte — Fire TV Stick 4K (10.1.0.41) via ADB (integração androidtv).
#
# A cada minuto, com a TV ligada, pergunta ao Fire TV qual app está na frente e o que
# está tocando (MediaSession), guarda em input_text e manda uma linha para o Loki
# (job="tv") — é de lá que o Grafana tira histórico, horário e tempo por app.
# Título só aparece quando o app publica MediaSession (Netflix, YouTube, Prime,
# Disney+, Globoplay, Jellyfin, Spotify costumam publicar).

input_text:
  tv_suite_app:
    name: TV Suíte - app
    max: 100
  tv_suite_estado:
    name: TV Suíte - estado
    max: 20
  tv_suite_titulo:
    name: TV Suíte - título
    max: 255

rest_command:
  tv_suite_loki:
    url: http://10.1.1.15:3100/loki/api/v1/push
    method: POST
    content_type: application/json
    payload: >-
      {"streams":[{"stream":{"job":"tv","tv":"suite","app":{{ app | tojson }},"estado":{{ estado | tojson }}},
      "values":[["{{ (now().timestamp() * 1000000000) | int }}",{{ {"app": app, "titulo": titulo, "estado": estado, "app_id": app_id} | tojson | tojson }}]]}]}

template:
  - sensor:
      - name: TV Suíte app
        unique_id: tv_suite_app
        icon: mdi:television-play
        state: >-
          {% set s = states('media_player.tv_suite') %}
          {% if s in ['off', 'standby', 'unavailable', 'unknown'] %}Desligada
          {% else %}{{ states('input_text.tv_suite_app') or 'Início' }}{% endif %}
      - name: TV Suíte assistindo
        unique_id: tv_suite_assistindo
        icon: mdi:movie-open-play
        state: >-
          {% set t = states('input_text.tv_suite_titulo') %}
          {% if states('media_player.tv_suite') in ['off', 'standby', 'unavailable'] or t in ['', 'unknown'] %}—
          {% else %}{{ t }}{% endif %}
    binary_sensor:
      - name: TV Suíte ligada
        unique_id: tv_suite_ligada
        device_class: running
        state: "{{ states('media_player.tv_suite') not in ['off', 'standby', 'unavailable', 'unknown'] }}"
      - name: TV Suíte reproduzindo
        unique_id: tv_suite_reproduzindo
        device_class: running
        state: "{{ is_state('input_text.tv_suite_estado', 'playing') }}"

sensor:
  - platform: history_stats
    name: TV Suíte ligada hoje
    unique_id: tv_suite_ligada_hoje
    entity_id: binary_sensor.tv_suite_ligada
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: TV Suíte reproduzindo hoje
    unique_id: tv_suite_reproduzindo_hoje
    entity_id: binary_sensor.tv_suite_reproduzindo
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: TV Suíte ligada na semana
    unique_id: tv_suite_ligada_semana
    entity_id: binary_sensor.tv_suite_ligada
    state: "on"
    type: time
    start: "{{ today_at() - timedelta(days=now().weekday()) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: TV Suíte ligada no mês
    unique_id: tv_suite_ligada_mes
    entity_id: binary_sensor.tv_suite_ligada
    state: "on"
    type: time
    start: "{{ today_at().replace(day=1) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: TV Suíte ligações hoje
    unique_id: tv_suite_ligacoes_hoje
    entity_id: binary_sensor.tv_suite_ligada
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

automation:
  - id: tv_suite_coleta
    alias: TV Suíte - coleta de app e título
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: media_player.tv_suite
    conditions:
      - condition: template
        value_template: "{{ states('media_player.tv_suite') not in ['off', 'standby', 'unavailable', 'unknown'] }}"
    actions:
      - action: androidtv.adb_command
        target:
          entity_id: media_player.tv_suite
        data:
          command: >-
            echo "TOP=$(dumpsys activity activities | grep -m1 -E 'mResumedActivity|topResumedActivity' | grep -oE 'u0 [^/ ]+' | cut -d' ' -f2)";
            dumpsys media_session | grep -E 'package=|state=PlaybackState|description=' | head -24
      - variables:
          resp: "{{ state_attr('media_player.tv_suite', 'adb_response') or '' }}"
          app_id: >-
            {% set m = resp | regex_findall('TOP=([A-Za-z0-9._]+)') %}
            {{ m[0] if m else (state_attr('media_player.tv_suite', 'app_id') or '') }}
          nomes:
            com.netflix.ninja: Netflix
            com.amazon.firebat: Prime Video
            com.amazon.avod: Prime Video
            com.amazon.firetv.youtube: YouTube
            com.google.android.youtube.tv: YouTube
            com.amazon.firetv.youtube.tv: YouTube TV
            com.disney.disneyplus: Disney+
            com.globo.globotv: Globoplay
            com.wbd.stream: Max
            com.hbo.hbonow: Max
            com.apple.atve.amazon.appletv: Apple TV
            com.spotify.tv.android: Spotify
            org.jellyfin.androidtv: Jellyfin
            com.plexapp.android: Plex
            org.xbmc.kodi: Kodi
            com.stremio.one: Stremio
            tv.pluto.android: Pluto TV
            com.cbs.ott: Paramount+
            com.crunchyroll.crunchyroid: Crunchyroll
            tv.twitch.android.app: Twitch
            com.amazon.amazonvideo.livingroom: Prime Video
            com.google.android.youtube.tvkids: YouTube Kids
            com.google.android.youtube.tvmusic: YouTube Music
            com.globo.globotv.androidtv: Globoplay
            com.google.android.tvlauncher: Início
            com.google.android.apps.tv.launcherx: Início
            com.google.android.tvrecommendations: Início
            com.android.tv.settings: Configurações
            com.tcl.tvweishi: Início
            com.google.android.apps.youtube.unplugged: YouTube TV
            com.mubi: MUBI
            com.vix: ViX
            com.spocky.projengmenu: Início
            com.amazon.tv.launcher: Início
            com.amazon.tv.settings.v2: Configurações
          app: "{{ nomes.get(app_id, app_id if app_id else 'Início') }}"
          titulo_ms: >-
            {% set ns = namespace(pkg='', t='') %}
            {% for l in resp.split('\n') %}
              {% if 'package=' in l %}{% set ns.pkg = l.split('package=')[1].strip() %}{% endif %}
              {% if 'description=' in l and ns.pkg == app_id and not ns.t %}
                {% set d = l.split('description=')[1] | regex_replace('(, null)+$', '') | trim %}
                {% if d and d != 'null' %}{% set ns.t = d %}{% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.t }}
          jf: >-
            {% set ns = namespace(e='') %}
            {% for e in integration_entities('jellyfin') | select('match', 'media_player') | list %}
              {% if not ns.e and states(e) in ['playing', 'paused'] and (state_attr(e, 'friendly_name') or '') is search('Fire TV', ignorecase=True) %}{% set ns.e = e %}{% endif %}
            {% endfor %}
            {{ ns.e }}
          titulo: >-
            {% if app == 'Jellyfin' and jf and not titulo_ms %}
              {% set serie = state_attr(jf, 'media_series_title') %}
              {% set ep = state_attr(jf, 'media_title') or '' %}
              {{ (serie ~ ' — ' ~ ep) if serie else ep }}
            {% else %}{{ titulo_ms }}{% endif %}
          estado: >-
            {% if app == 'Jellyfin' and jf %}{{ states(jf) }}{% else %}{{ states('media_player.tv_suite') }}{% endif %}
      - action: input_text.set_value
        target:
          entity_id: input_text.tv_suite_app
        data:
          value: "{{ app[:100] }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.tv_suite_estado
        data:
          value: "{{ estado }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.tv_suite_titulo
        data:
          value: "{{ titulo[:255] }}"
      - action: rest_command.tv_suite_loki
        data:
          app: "{{ app }}"
          app_id: "{{ app_id }}"
          titulo: "{{ titulo }}"
          estado: "{{ estado }}"
