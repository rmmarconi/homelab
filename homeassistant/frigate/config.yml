# Frigate 0.18 (add-on do Home Assistant) - câmeras Tuya via ONVIF/RTSP.
# As câmeras aceitam UMA sessão RTSP (Sala e Varanda); por isso cada uma tem
# um único stream no go2rtc, que redistribui para gravação, HA e Protect.
# __RTSP_USER__ / __RTSP_PASS__ são trocados no servidor pelo script
# set-frigate-cred.sh (a senha nunca vai para o git).

mqtt:
  enabled: false

go2rtc:
  streams:
    sala:
      - rtsp://__RTSP_USER__:__RTSP_PASS__@10.1.0.143:5543/4a72636492f929ea36e3d26267885b09/live/channel0
    cozinha:
      - rtsp://__RTSP_USER__:__RTSP_PASS__@10.1.0.184:5543/4a72636492f929ea36e3d26267885b09/live/channel0
    varanda:
      - rtsp://__RTSP_USER__:__RTSP_PASS__@10.1.0.240:5543/4a72636492f929ea36e3d26267885b09/live/channel0

detectors:
  cpu:
    type: cpu
    num_threads: 2

record:
  enabled: true
  continuous:
    days: 1
  motion:
    days: 7
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track: [person, car, dog, cat]

cameras:
  sala:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/sala
          input_args: preset-rtsp-restream
          roles: [record, detect]
    detect:
      enabled: false
    onvif:
      host: 10.1.0.143
      port: 8000
      user: __RTSP_USER__
      password: __RTSP_PASS__
  cozinha:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cozinha
          input_args: preset-rtsp-restream
          roles: [record, detect]
    detect:
      enabled: false
    onvif:
      host: 10.1.0.184
      port: 8000
      user: __RTSP_USER__
      password: __RTSP_PASS__
  varanda:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/varanda
          input_args: preset-rtsp-restream
          roles: [record, detect]
    detect:
      enabled: false
    onvif:
      host: 10.1.0.240
      port: 8000
      user: __RTSP_USER__
      password: __RTSP_PASS__
